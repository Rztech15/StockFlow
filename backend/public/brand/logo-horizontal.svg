<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F26A1B"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F84AA"/>
      <stop offset="1" stop-color="#46597F"/>
    </linearGradient>
  </defs>
  <g transform="translate(-90,-60) scale(0.65)">

  <!-- Navy isometric box -->
  <g stroke-linejoin="round" stroke-width="28">
    <polygon points="512,126 844,318 512,510 180,318" fill="url(#top)" stroke="url(#top)"/>
    <polygon points="180,318 512,510 512,898 180,706" fill="#1B2742" stroke="#1B2742"/>
    <polygon points="844,318 844,706 512,898 512,510" fill="#2C3E66" stroke="#2C3E66"/>
  </g>

  <!-- Edge highlight -->
  <polyline points="180,318 512,510 844,318" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6" stroke-linejoin="round"/>
  <line x1="512" y1="510" x2="512" y2="898" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Barcode on left face (skewed to face) -->
  <g transform="matrix(1,0.578,0,1,0,0)" fill="#FFFFFF" fill-opacity="0.35">
    <rect x="205" y="440" width="8" height="100"/>
    <rect x="220" y="440" width="4" height="100"/>
    <rect x="231" y="440" width="12" height="100"/>
    <rect x="250" y="440" width="5" height="100"/>
    <rect x="262" y="440" width="9" height="100"/>
    <rect x="278" y="440" width="4" height="100"/>
    <rect x="289" y="440" width="10" height="100"/>
  </g>

  <!-- Rising stock bars on right face (skewed to face) -->
  <g transform="matrix(1,-0.578,0,1,0,0)" fill="url(#og)">
    <rect x="715" y="1060" width="26" height="50" rx="4"/>
    <rect x="755" y="1030" width="26" height="80" rx="4"/>
    <rect x="795" y="995" width="26" height="115" rx="4"/>
  </g>

  <!-- Soft glow behind S -->
  

  <path d="M 620.3 324.5 A 125 125 0 1 0 512 512" fill="none" stroke="#141D33" stroke-opacity="0.35" stroke-width="72"/>
  <!-- S ribbon: white (stock in) -> orange (stock out) -->
  <g fill="none" stroke-width="56">
    <path d="M 620.3 324.5 A 125 125 0 1 0 512 512" stroke="#FFFFFF"/>
    <path d="M 512 512 A 125 125 0 1 1 403.7 699.5" stroke="url(#og)"/>
  </g>
  <polygon points="667.9,297 572.7,352 657.8,389.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="356.1,727 451.3,672 366.2,634.5" fill="#F26A1B" stroke="#F26A1B" stroke-width="8" stroke-linejoin="round"/>

  <!-- Smart node at centre -->
  <circle cx="512" cy="512" r="20" fill="#1B2742" stroke="#FFFFFF" stroke-width="8"/>
</g>
  <g font-family="'Poppins','Montserrat','Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="520" y="320" font-size="190" letter-spacing="-4"><tspan fill="#1B2742">Stock</tspan><tspan fill="url(#og)">Flow</tspan></text>
    <text x="528" y="420" font-size="44" font-weight="600" letter-spacing="9" fill="#5F7399">SMART INVENTORY MANAGEMENT</text>
  </g>
</svg>