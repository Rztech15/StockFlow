[alembic]
script_location = migrations
# The database URL is NOT stored here. migrations/env.py reads MIGRATION_DATABASE_URL.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s %(message)s
