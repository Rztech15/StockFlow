[project]
name = "stockflow-backend"
version = "0.0.0"
description = "StockFlow API (Phase 0 foundation)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "db: needs the real PostgreSQL (docker compose) with bootstrap + migrations applied",
  "rls: tenant-isolation tests (real stockflow_app role)",
  "guard: catalog / RLS guard",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

# Rule: application code must not touch the raw driver, SQLAlchemy engines or the environment.
# Only app/db.py talks to the database; only app/config.py reads configuration.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"psycopg".msg = "Use app.db.tenant_tx(). Raw database access is not allowed here."
"sqlalchemy".msg = "Import text/Connection from app.db instead of using SQLAlchemy directly."
"os.environ".msg = "Read configuration only through app/config.py."
"os.getenv".msg = "Read configuration only through app/config.py."

[tool.ruff.lint.per-file-ignores]
"app/db.py" = ["TID251"]
"app/config.py" = ["TID251"]
"tests/*" = ["TID251"]
"scripts/*" = ["TID251"]
"migrations/*" = ["TID251"]
